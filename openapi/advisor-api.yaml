openapi: 3.0.3
info:
  title: advisor-api
  version: 1.0.0
  description: API for matching Pokemon card suggestions based on collector tags.
servers:
  - url: http://localhost:8082
paths:
  /api/v1/suggestions:
    get:
      summary: Get card suggestions
      operationId: suggestCards
      parameters:
        - in: query
          name: tags
          required: true
          description: One to three card tags used for matching.
          schema:
            type: array
            minItems: 1
            maxItems: 3
            items:
              $ref: '#/components/schemas/CardTag'
          style: form
          explode: true
      responses:
        '200':
          description: Ranked card suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionResponse'
        '400':
          description: Validation or query error
components:
  schemas:
    SuggestionResponse:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/CardSuggestion'
    CardSuggestion:
      type: object
      required: [cardId, cardName, averageRating, ratingCount, matchedTags]
      properties:
        cardId:
          $ref: '#/components/schemas/CardId'
        cardName:
          type: string
        averageRating:
          type: number
          format: double
        ratingCount:
          type: integer
        matchedTags:
          type: array
          items:
            $ref: '#/components/schemas/CardTag'
        lastReviewDescription:
          type: string
          nullable: true
    CardId:
      type: string
      enum:
        - CHARIZARD_BASE_SET
        - PIKACHU_JUNGLE
        - BLASTOISE_BASE_SET
        - VENUSAUR_BASE_SET
        - MEWTWO_PROMO
        - LUGIA_NEO_GENESIS
        - UMBREON_MOONBREON
        - SNORLAX_JUNGLE
        - GENGAR_FOSSIL
        - EEVEE_PROMO
        - DRAGONITE_FOSSIL
        - GYARADOS_BASE_SET
        - ALAKAZAM_BASE_SET
        - RAICHU_BASE_SET
        - LAPRAS_FOSSIL
        - MACHAMP_FIRST_EDITION
        - ZAPDOS_FOSSIL
        - ARCANINE_BASE_SET
        - MEW_BLACK_STAR
        - TYRANITAR_NEO_DISCOVERY
    CardTag:
      type: string
      enum:
        - FIRE
        - WATER
        - GRASS
        - ELECTRIC
        - PSYCHIC
        - FIGHTING
        - DARK
        - DRAGON
        - HOLO
        - VINTAGE
        - STARTER
        - LEGENDARY
        - PROMO
        - PLAYABLE
        - ART_RARE
        - COLLECTION_CENTERPIECE
